name: Publish academic website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set GitHub Pages metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('dist/index.html')
          page.write_text(page.read_text().replace('https://weimin-wu-research.weiminxxxx.chatgpt.site', 'https://weiminwu2000.github.io'))
          PY
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Clear stalled Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYRECOVER'
          import os, urllib.request, urllib.error
          # This superseded deployment remained active after its workflow ended.
          url = 'https://api.github.com/repos/WeiminWu2000/WeiminWu2000.github.io/pages/deployments/7844ff7e67efef38ee1fac0faeb0d77c02a8432d/cancel'
          request = urllib.request.Request(url, method='POST', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2026-03-10',
          })
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print('Stalled deployment cancellation:', response.status)
          except urllib.error.HTTPError as error:
              if error.code not in (404, 409, 422):
                  raise
              print('Previous deployment no longer cancellable:', error.code)
          PYRECOVER
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
